# Dashboard provisioning — loads every *.json under dashboards/.
apiVersion: 1

providers:
  - name: jlmirror
    orgId: 1
    folder: JLMirror
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
