# HTTP → HTTPS redirect: habilitar quando TLS estiver configurado
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    # Re-resolve upstream hostnames via Docker DNS (evita IP stale após restart de containers)
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: habilitar quando HTTPS estiver ativo
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Landing page — somente raiz exata
    # try_files evita o redirect interno do `index` que cairia no proxy do BFF
    location = / {
        root  /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Arquivo HTML direto (sem redirect)
    location = /index.html {
        root /usr/share/nginx/html;
    }

    # Tudo mais vai pro BFF (JLMirror)
    location / {
        set $bff http://bff:8080;
        proxy_pass         $bff;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
