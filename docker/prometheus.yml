# Dev Prometheus scrape config — the API exposes /metrics on the
# internal network only; Prometheus reaches it as api:8000.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # When API_MTLS=1 the API requires client certs; the mounted worker
  # identity is a valid mTLS peer. For plain-dev (no mTLS) switch
  # scheme to http and drop tls_config.
  - job_name: jlmirror-api
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /run/secrets/tls/ca.pem
      cert_file: /run/secrets/tls/worker-cert.pem
      key_file: /run/secrets/tls/worker-key.pem
      insecure_skip_verify: false
    static_configs:
      - targets: ["api:8000"]
