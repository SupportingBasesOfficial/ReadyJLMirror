# JLMirror — Production overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires PUBLIC_DOMAIN, KC_DOMAIN and all REQUIRED_CHANGE_ME values filled
# in .env before running. See .env.prod.example.

services:

  # ── Caddy: TLS automático via Let's Encrypt ──────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      KC_DOMAIN: ${KC_DOMAIN}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
    depends_on:
      bff:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ── Migrate: precisa dos secrets para autenticar como jlmirror_owner ────────
  migrate:
    volumes:
      - ./secrets:/run/secrets:ro

  # ── BFF: sem volumes de dev, URL pública correta ─────────────────────────────
  bff:
    volumes:
      - ./secrets:/run/secrets:ro
    environment:
      BFF_PUBLIC_URL: https://${PUBLIC_DOMAIN}
      KEYCLOAK_PUBLIC_URL: https://${KC_DOMAIN}
      DEV_AUTH_BYPASS: "false"
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL}

  # ── API: sem volumes de dev; adiciona VAPID (usado pelo router push) ──────────
  api:
    volumes:
      - ./secrets:/run/secrets:ro
      - ./secrets-tokens:/run/secret-bindings
    environment:
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL}

  # ── Worker: sem volumes de dev ────────────────────────────────────────────────
  worker:
    volumes:
      - ./secrets:/run/secrets:ro
      - ./secrets-tokens:/run/secret-bindings:ro

  # ── Keycloak: modo produção com proxy reverso ─────────────────────────────────
  keycloak:
    command: start --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_DOMAIN}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

volumes:
  caddy_data:
  caddy_config:
