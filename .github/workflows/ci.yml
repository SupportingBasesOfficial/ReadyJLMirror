name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: jlmirror
          POSTGRES_USER: jlmirror_owner
          POSTGRES_PASSWORD: jlmirror_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jlmirror_owner -d jlmirror"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check .

      - name: Bootstrap app role (mirrors docker/db-init)
        env:
          PGPASSWORD: jlmirror_dev
        run: |
          psql -h localhost -U jlmirror_owner -d jlmirror \
            -f docker/db-init/001-create-app-role.sql

      - name: Migrations (fresh DB — proves clone-and-run)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: jlmirror
          DB_USER: jlmirror_owner
          DB_PASSWORD: jlmirror_dev
        run: python -m scripts.migrate

      - name: pytest (real PostgreSQL — integration included)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: jlmirror
          DB_USER: jlmirror_owner
          DB_PASSWORD: jlmirror_dev
          APP_ENVIRONMENT: development
          DEV_AUTH_BYPASS: "true"
        run: pytest -q

      - name: Restore rehearsal (ADR-018 — backup + isolated verify)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: jlmirror
          DB_USER: jlmirror_owner
          DB_PASSWORD: jlmirror_dev
        run: |
          python -m scripts.backup --local
          python -m scripts.restore_verify --local

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker compose config --quiet
      - run: docker compose build
