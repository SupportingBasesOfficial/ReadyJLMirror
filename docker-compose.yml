services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: jlmirror
      POSTGRES_USER: jlmirror_owner
      POSTGRES_PASSWORD: jlmirror_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jlmirror_owner -d jlmirror"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_app
      DB_PASSWORD: jlmirror_dev
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  migrate:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_owner
      DB_PASSWORD: jlmirror_dev
    depends_on:
      db:
        condition: service_healthy
    command: python -m scripts.migrate
    profiles:
      - migrate

  worker:
    build: .
    environment:
      APP_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_app
      DB_PASSWORD: jlmirror_dev
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.workers.run_all
    profiles:
      - worker

volumes:
  db_data:
