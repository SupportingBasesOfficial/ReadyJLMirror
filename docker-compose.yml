services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: jlmirror
      POSTGRES_USER: jlmirror_owner
      POSTGRES_PASSWORD: jlmirror_dev
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jlmirror_owner -d jlmirror"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 30

  openbao:
    image: openbao/openbao:latest
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root-token
    ports:
      - "8200:8200"
    command: server -dev
    profiles:
      - secrets

  migrate:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_owner
      DB_PASSWORD: jlmirror_dev
    depends_on:
      db:
        condition: service_healthy
    command: python -m scripts.migrate

  api:
    build: .
    environment:
      NOTIFICATION_CALLBACK_SECRET: ${NOTIFICATION_CALLBACK_SECRET:-dev-callback-secret}
      APP_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_app
      DB_PASSWORD: jlmirror_dev
      BFF_INTERNAL_SECRET: dev-internal-secret-change-me
      SECRETS_DIR: /run/secrets
      # Provider tokens supplied at onboarding land here (write-only
      # for the API; the worker mounts it read-only).
      CREDENTIALS_DIR: /run/secret-bindings
      # Onboarding discovery calls the provider from the API — same
      # fail-closed egress posture as the worker.
      EGRESS_ALLOW_HOSTS: ${EGRESS_ALLOW_HOSTS:-}
      EGRESS_ALLOW_PRIVATE_IPS: ${EGRESS_ALLOW_PRIVATE_IPS:-}
      PROVIDER_CA_FILE: ${PROVIDER_CA_FILE:-}
      # Opt-in mTLS: python -m scripts.dev_tls, then set API_MTLS=1
      # plus the cert paths in .env (see .env.example).
      API_MTLS: ${API_MTLS:-}
      API_TLS_CERT_FILE: ${API_TLS_CERT_FILE:-}
      API_TLS_KEY_FILE: ${API_TLS_KEY_FILE:-}
      API_CA_FILE: ${API_CA_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro
      - ./secrets-tokens:/run/secret-bindings
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import os,httpx,sys; mtls=os.environ.get('API_MTLS'); port=os.environ.get('API_PORT','8000'); kw={'cert':('/run/secrets/tls/bff-cert.pem','/run/secrets/tls/bff-key.pem'),'verify':'/run/secrets/tls/ca.pem'} if mtls else {}; scheme='https' if mtls else 'http'; sys.exit(0 if httpx.get(f'{scheme}://localhost:{port}/health',timeout=3,**kw).status_code==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m api.main
    # Internal only — the BFF is the public boundary.

  bff:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_app
      DB_PASSWORD: jlmirror_dev
      BFF_PUBLIC_URL: http://localhost:8080
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      BFF_CLIENT_CERT_FILE: ${BFF_CLIENT_CERT_FILE:-}
      BFF_CLIENT_KEY_FILE: ${BFF_CLIENT_KEY_FILE:-}
      API_CA_FILE: ${API_CA_FILE:-}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_REALM: jlmirror
      KEYCLOAK_CLIENT_ID: jlmirror-bff
      KEYCLOAK_CLIENT_SECRET: dev-bff-secret-change-me
      BFF_INTERNAL_SECRET: dev-internal-secret-change-me
      DEV_AUTH_BYPASS: "true"
      SECRETS_DIR: /run/secrets
      # Opt-in TLS: python -m scripts.dev_tls generates
      # secrets/tls/{cert,key}.pem, then set these in .env or host env.
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    command: python -m bff.main

  worker:
    build: .
    environment:
      APP_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_worker
      DB_PASSWORD: jlmirror_dev
      CREDENTIALS_DIR: /run/secret-bindings
      SECRETS_DIR: /run/secrets
      # Dev webhook: real HTTP delivery to the API sink — leave
      # empty for dev-log simulated receipts. When API_MTLS=1 the
      # dispatcher upgrades to https and presents WORKER_CLIENT_*.
      API_MTLS: ${API_MTLS:-}
      API_CA_FILE: ${API_CA_FILE:-}
      WORKER_CLIENT_CERT_FILE: ${WORKER_CLIENT_CERT_FILE:-/run/secrets/tls/worker-cert.pem}
      WORKER_CLIENT_KEY_FILE: ${WORKER_CLIENT_KEY_FILE:-/run/secrets/tls/worker-key.pem}
      ALERTING_WEBHOOK_URL: ${ALERTING_WEBHOOK_URL:-http://api:8000/dev/outbox-sink}
      # G9 WhatsApp adapter — dev points at the API's dev sink
      # (returns provider-shaped wamid). Prod: Meta Graph URL +
      # token via credential binding.
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-http://bff:8080/dev/whatsapp}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      NOTIFICATION_CALLBACK_SECRET: ${NOTIFICATION_CALLBACK_SECRET:-dev-callback-secret}
      # G10 ITSM adapter — dev empty = simulated provider
      # (deterministic dev-ticket-* refs). Prod: governed ITSM bridge
      # URL; the token goes through a credential binding.
      ITSM_PROVIDER_URL: ${ITSM_PROVIDER_URL:-}
      # Provider egress (dev Zabbix profile / intranet deployments)
      EGRESS_ALLOW_HOSTS: ${EGRESS_ALLOW_HOSTS:-}
      EGRESS_ALLOW_PRIVATE_IPS: ${EGRESS_ALLOW_PRIVATE_IPS:-}
      PROVIDER_CA_FILE: ${PROVIDER_CA_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro
      - ./secrets-tokens:/run/secret-bindings:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m workers.run_all
    profiles:
      - worker

  # ------------------------------------------------------------------
  # Dev Zabbix provider profile — a REAL Zabbix server + web API +
  # agent so the whole monitoring pipeline exercises real provider
  # traffic (docker compose --profile zabbix up -d).
  # ------------------------------------------------------------------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: db
      POSTGRES_DB: zabbix
      POSTGRES_USER: jlmirror_owner
      POSTGRES_PASSWORD: jlmirror_dev
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - zabbix

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: db
      POSTGRES_DB: zabbix
      POSTGRES_USER: jlmirror_owner
      POSTGRES_PASSWORD: jlmirror_dev
      PHP_TZ: UTC
      ZBX_SERVER_NAME: zabbix-web
      ZBX_SERVER_HOST: zabbix-server
    volumes:
      - ./secrets/tls/zbx-cert.pem:/etc/ssl/nginx/ssl.crt:ro
      - ./secrets/tls/zbx-key.pem:/etc/ssl/nginx/ssl.key:ro
      - ./secrets/tls/dhparam.pem:/etc/ssl/nginx/dhparam.pem:ro
    ports:
      - "8443:8443"
    depends_on:
      zabbix-server:
        condition: service_started
    profiles:
      - zabbix

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: zbx-agent-1
    depends_on:
      zabbix-server:
        condition: service_started
    profiles:
      - zabbix

volumes:
  db_data:
