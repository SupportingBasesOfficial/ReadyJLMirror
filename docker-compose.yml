services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: jlmirror
      POSTGRES_USER: jlmirror_owner
      POSTGRES_PASSWORD: jlmirror_dev
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jlmirror_owner -d jlmirror"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 30

  openbao:
    image: openbao/openbao:latest
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root-token
    ports:
      - "8200:8200"
    command: server -dev
    profiles:
      - secrets

  migrate:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_owner
      DB_PASSWORD: jlmirror_dev
    depends_on:
      db:
        condition: service_healthy
    command: python -m scripts.migrate

  api:
    build: .
    environment:
      APP_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_app
      DB_PASSWORD: jlmirror_dev
      BFF_INTERNAL_SECRET: dev-internal-secret-change-me
      SECRETS_DIR: /run/secrets
      # Opt-in mTLS: python -m scripts.dev_tls, then set API_MTLS=1
      # plus the cert paths in .env (see .env.example).
      API_MTLS: ${API_MTLS:-}
      API_TLS_CERT_FILE: ${API_TLS_CERT_FILE:-}
      API_TLS_KEY_FILE: ${API_TLS_KEY_FILE:-}
      API_CA_FILE: ${API_CA_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health',timeout=3).status_code==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m api.main
    # Internal only — the BFF is the public boundary.

  bff:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_app
      DB_PASSWORD: jlmirror_dev
      BFF_PUBLIC_URL: http://localhost:8080
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      BFF_CLIENT_CERT_FILE: ${BFF_CLIENT_CERT_FILE:-}
      BFF_CLIENT_KEY_FILE: ${BFF_CLIENT_KEY_FILE:-}
      API_CA_FILE: ${API_CA_FILE:-}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_REALM: jlmirror
      KEYCLOAK_CLIENT_ID: jlmirror-bff
      KEYCLOAK_CLIENT_SECRET: dev-bff-secret-change-me
      BFF_INTERNAL_SECRET: dev-internal-secret-change-me
      DEV_AUTH_BYPASS: "true"
      SECRETS_DIR: /run/secrets
      # Opt-in TLS: python -m scripts.dev_tls generates
      # secrets/tls/{cert,key}.pem, then set these in .env or host env.
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    command: python -m bff.main

  worker:
    build: .
    environment:
      APP_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jlmirror
      DB_USER: jlmirror_worker
      DB_PASSWORD: jlmirror_dev
      CREDENTIALS_DIR: /run/secrets
      SECRETS_DIR: /run/secrets
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m workers.run_all
    profiles:
      - worker

volumes:
  db_data:
