<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLMirror</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f1115; color: #e6e8ec; min-height: 100vh;
  }
  /* ---------- app frame ---------- */
  .topbar { display: flex; justify-content: space-between; align-items:
    center; padding: .7rem 1.2rem; background: #161a22;
    border-bottom: 1px solid #262c3a; position: sticky; top: 0;
    z-index: 10; }
  .topbar .brand { font-size: 1.05rem; font-weight: 600; }
  .topbar .brand b { color: #6ea8fe; font-weight: 600; }
  .topbar .right { display: flex; align-items: center; gap: .6rem; }
  .topbar .who { font-size: .75rem; color: #8b93a5; }
  .layout { display: flex; min-height: calc(100vh - 47px); }
  .sidenav { width: 180px; flex-shrink: 0; background: #12151c;
    border-right: 1px solid #262c3a; padding: .8rem .5rem; }
  .navbtn { display: block; width: 100%; text-align: left;
    background: none; border: none; color: #c3c8d4; font-size: .85rem;
    padding: .55rem .8rem; border-radius: 6px; cursor: pointer; }
  .navbtn:hover { background: #1c2130; }
  .navbtn.active { background: #1c2130; color: #6ea8fe; }
  main { flex: 1; padding: 1.2rem 1.5rem; min-width: 0; }
  .hidden { display: none !important; }
  /* ---------- centered panel (auth states) ---------- */
  .centerwrap { display: flex; align-items: center; justify-content:
    center; min-height: calc(100vh - 100px); }
  .card {
    background: #161a22; border: 1px solid #262c3a; border-radius: 10px;
    padding: 2.5rem 3rem; min-width: 340px; max-width: 480px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .panel { background: #161a22; border: 1px solid #262c3a;
    border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; }
  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; font-size: .82rem;
    margin: .5rem 0 1rem; }
  th, td { text-align: left; padding: .45rem .6rem;
    border-bottom: 1px solid #262c3a; }
  th { color: #8b93a5; font-weight: 500; font-size: .72rem;
    text-transform: uppercase; letter-spacing: .04em; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #1c2130; }
  .sev-unknown { color: #8b93a5; }
  .sev-informational { color: #6ea8fe; }
  .sev-warning { color: #e6b450; }
  .sev-degraded { color: #f08080; }
  .sev-critical { color: #ff6b6b; font-weight: 600; }
  .h-healthy { color: #6fdc8c; }
  .h-degraded { color: #e6b450; }
  .h-unhealthy { color: #ff6b6b; font-weight: 600; }
  .h-unknown { color: #8b93a5; }
  .op-pending, .op-running { color: #6ea8fe; }
  .op-succeeded { color: #6fdc8c; }
  .op-reconciliation_required { color: #e6b450; }
  .op-failed_terminal { color: #ff6b6b; font-weight: 600; }
  .op-bad { background: rgba(255,107,107,.05); }
  .a-active { color: #e6b450; font-weight: 600; }
  .a-resolved { color: #6fdc8c; }
  /* G10 incident lifecycle */
  .a-open { color: #e6b450; font-weight: 600; }
  .a-in_progress { color: #6ea8fe; font-weight: 600; }
  .a-closed { color: #8b93a5; }
  button.link { background: none; border: none; color: #6ea8fe;
    cursor: pointer; font-size: .8rem; padding: 0; text-align: left; }
  button.link:hover { text-decoration: underline; }
  .section h3 { font-size: .85rem; margin: .6rem 0 .2rem; }
  .section h4 { font-size: .72rem; color: #8b93a5; margin: .7rem 0 .15rem;
    text-transform: uppercase; letter-spacing: .04em; }
  /* G9 delivery states */
  .d-dispatching, .d-sent { color: #6ea8fe; }
  .d-provider_accepted { color: #9d8cf5; }
  .d-delivered { color: #6fdc8c; }
  .d-external_read_observed { color: #6fdc8c; font-weight: 600; }
  .d-failed { color: #ff6b6b; font-weight: 600; }
  .d-unknown { color: #8b93a5; }
  .flag { display: inline-block; font-size: .68rem; padding: .1rem .4rem;
    border-radius: 4px; background: #3a2a1a; color: #e6b450;
    margin-left: .35rem; }
  .flag.bad { background: #3a1a1a; color: #ff6b6b; }
  .flag.ok { background: #16301f; color: #6fdc8c; }
  .timeline { list-style: none; margin: .25rem 0; padding: 0; }
  .timeline li { font-size: .8rem; padding: .3rem 0 .3rem .8rem;
    border-left: 2px solid #262c3a; color: #c3c8d4; }
  .timeline li .t-kind { color: #6ea8fe; }
  .timeline li .t-at { color: #8b93a5; font-size: .72rem; }
  .note { color: #8b93a5; font-size: .74rem; margin: .35rem 0 0; }
  form select { display: block; width: 100%; margin-top: .25rem;
    background: #1c2130; border: 1px solid #262c3a; border-radius: 6px;
    color: #e6e8ec; padding: .5rem .7rem; font-size: .85rem; }
  .section { margin-top: 1.5rem; padding-top: 1rem;
    border-top: 1px solid #262c3a; }
  .actions { display: flex; gap: .4rem; flex-wrap: wrap;
    margin: .75rem 0 1rem; }
  .actions button { font-size: .75rem; padding: .35rem .7rem; }
  .empty { color: #8b93a5; font-size: .82rem; margin: .5rem 0; }
  form label { display: block; font-size: .78rem; color: #8b93a5;
    margin-bottom: .6rem; }
  form input { display: block; width: 100%; margin-top: .25rem;
    background: #1c2130; border: 1px solid #262c3a; border-radius: 6px;
    color: #e6e8ec; padding: .5rem .7rem; font-size: .85rem; }
  form input:focus { outline: none; border-color: #2f6fed; }
  h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: .25rem; }
  .sub { color: #8b93a5; font-size: .85rem; margin-bottom: 1.5rem; }
  button, .btn {
    display: inline-block; background: #2f6fed; color: #fff; border: 0;
    border-radius: 6px; padding: .55rem 1.1rem; font-size: .9rem;
    cursor: pointer; text-decoration: none;
  }
  button:hover, .btn:hover { background: #265cd6; }
  button.secondary { background: #262c3a; }
  button.secondary:hover { background: #313950; }
  button.small { padding: .3rem .7rem; font-size: .75rem; }
  .tenant { margin: .5rem 0; padding: .75rem 1rem; background: #1c2130;
    border: 1px solid #262c3a; border-radius: 8px; display: flex;
    justify-content: space-between; align-items: center; }
  .meta { font-size: .8rem; color: #8b93a5; margin-top: 1.5rem; }
  .meta code { color: #b6bfce; }
  .badge { font-size: .7rem; background: #1c2130; border: 1px solid #262c3a;
    padding: .2rem .6rem; border-radius: 999px; color: #8b93a5; }
  .error { color: #f08080; font-size: .85rem; margin-bottom: 1rem; }
  .spinner { width: 18px; height: 18px; border: 2px solid #262c3a;
    border-top-color: #6ea8fe; border-radius: 50%; margin: 0 auto 1rem;
    animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ---------- view header ---------- */
  .viewhead { display: flex; align-items: center; gap: .8rem;
    margin-bottom: 1rem; }
  .viewhead h2 { font-size: 1rem; font-weight: 600; }
  .viewhead .spacer { flex: 1; }
  .backbtn { background: none; border: none; color: #6ea8fe;
    font-size: .82rem; cursor: pointer; padding: 0; }
  .backbtn:hover { text-decoration: underline; }
  .chip { background: #1c2130; border: 1px solid #262c3a; color: #c3c8d4;
    font-size: .75rem; padding: .25rem .7rem; border-radius: 999px;
    cursor: pointer; }
  .chip.active { border-color: #6ea8fe; color: #6ea8fe; }
</style>
</head>
<body>
<div class="topbar hidden" id="topbar">
  <span class="brand"><b>JL</b>Mirror</span>
  <span class="right">
    <span class="who" id="topWho"></span>
    <span class="badge" id="topTenant"></span>
    <button class="secondary small" id="changeTenant">tenant</button>
    <form method="post" action="/auth/logout" style="display:inline">
      <button class="secondary small">sign out</button>
    </form>
  </span>
</div>
<div class="layout">
  <nav class="sidenav hidden" id="sidenav">
    <button class="navbtn" data-view="alerts">Alerts</button>
    <button class="navbtn" data-view="monitoring">Monitoring</button>
    <button class="navbtn" data-view="admin">Administration</button>
  </nav>
  <main>
    <div class="error hidden" id="err"></div>
    <div id="root"><div class="spinner"></div></div>
    <div class="meta" id="meta"></div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
